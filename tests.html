<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>NES Lab self-tests</title><style>body{font:16px ui-monospace,monospace;background:#0b0f14;color:#ddd;padding:30px}.ok{color:#8bd49c}.bad{color:#ff7b72}pre{white-space:pre-wrap}</style></head><body><h1>NES Lab Self-tests</h1><div id="out"></div><script type="module">import {runSelfTests} from './tests/selftest.mjs';const r=runSelfTests();document.querySelector('#out').innerHTML=`<h2 class="${r.failed?'bad':'ok'}">${r.passed}/${r.total} passed</h2>`+r.results.map(x=>`<p class="${x.ok?'ok':'bad'}">${x.ok?'PASS':'FAIL'} ${x.name}</p>${x.ok?'':`<pre>${x.error}</pre>`}`).join('');</script></body></html>
